<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackAlem Project</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1b1b1b; --mut:#6b6b6b; --card:#fff; --line:#e3e3df;
          --crit:#b42318; --warn:#b54708; --info:#175cd3; --ok:#067647; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg) }
  main { max-width:1100px; margin:0 auto; padding:24px 16px }
  h1 { margin:0 0 4px; font-size:22px } .sub { color:var(--mut); margin:0 0 20px }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px }
  @media (max-width:800px){ .grid{grid-template-columns:1fr} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px }
  textarea { width:100%; min-height:260px; font:13px/1.4 ui-monospace, monospace; padding:10px;
             border:1px solid var(--line); border-radius:8px }
  button, select { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer }
  button.primary { background:var(--fg); color:#fff; border-color:var(--fg) }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px }
  .f { border-left:4px solid var(--line); padding:8px 12px; margin:10px 0; background:#fafaf8; border-radius:6px }
  .f.critical{border-color:var(--crit)} .f.warning{border-color:var(--warn)} .f.info{border-color:var(--info)}
  .f.accepted{opacity:.75; outline:2px solid var(--ok)} .f.rejected{opacity:.45; text-decoration:line-through}
  .tag { font-size:12px; color:var(--mut) } blockquote { margin:6px 0; padding-left:10px; border-left:2px solid var(--line); color:#444; font-size:13px }
  .mode { font-size:12px; padding:2px 8px; border-radius:99px; background:#eee }
  pre { white-space:pre-wrap; font-size:12px; color:var(--mut) }
</style>
</head>
<body>
<main>
  <h1 id="title">HackAlem Project</h1>
  <p class="sub">TODO(kickoff): одна фраза — кто пользователь и какое действие он выполняет. <span id="mode" class="mode"></span></p>
  <div class="grid">
    <section class="card">
      <strong>Вход</strong>
      <div class="row"><select id="samples"><option value="">— пример —</option></select>
        <input type="file" id="file" accept=".txt,.md,.csv,.tsv,.json,.eml,.pdf,.xlsx,.docx"></div>
      <textarea id="text" placeholder="Вставьте документ…"></textarea>
      <div class="row"><button class="primary" id="go">Проверить</button><span id="status" class="tag"></span></div>
    </section>
    <section class="card">
      <strong>Результат</strong>
      <div id="summary" class="tag"></div>
      <div id="findings"></div>
      <div class="row"><button id="report" disabled>Отчёт</button></div>
      <details><summary class="tag">Шаги агента</summary><pre id="trace"></pre></details>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("/health").then(r => r.json()).then(h => $("mode").textContent = h.mode + " · " + h.model);
fetch("/api/samples").then(r => r.json()).then(list => {
  list.forEach(s => { const o = document.createElement("option"); o.value = s.text; o.textContent = s.name; $("samples").append(o); });
});
$("samples").onchange = e => { if (e.target.value) $("text").value = e.target.value; };

function render(res) {
  current = res;
  $("summary").textContent = res.extraction.summary + (res.extraction.missing.length ? " · не найдено: " + res.extraction.missing.join(", ") : "");
  $("findings").innerHTML = res.findings.length ? "" : "<p class='tag'>Замечаний нет.</p>";
  res.findings.forEach(f => {
    const d = document.createElement("div");
    d.className = `f ${f.severity} ${f.status}`;
    d.innerHTML = `<div><strong>${esc(f.title)}</strong> <span class="tag">${f.severity} · ${f.produced_by}${f.rule_id ? " · " + f.rule_id : ""}</span></div>
      <div>${esc(f.explanation)}</div>
      ${f.evidence.map(e => `<blockquote>${esc(e.source)} ${esc(e.locator)}: «${esc(e.quote)}»</blockquote>`).join("")}
      ${f.suggestion ? `<div class="tag">Предложение: ${esc(f.suggestion)}</div>` : ""}
      <div class="row"><button data-s="accepted">Принять</button><button data-s="rejected">Отклонить</button></div>`;
    d.querySelectorAll("button").forEach(b => b.onclick = () => decide(f.id, b.dataset.s));
    $("findings").append(d);
  });
  $("trace").textContent = JSON.stringify(res.trace, null, 2);
  $("report").disabled = false;
}

async function decide(id, status) {
  const r = await fetch(`/api/runs/${current.run_id}/decision`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({finding_id:id, status})});
  if (r.ok) render(await r.json());
}

$("go").onclick = async () => {
  const text = $("text").value.trim(); if (!text) return;
  $("status").textContent = "Агент работает…"; $("go").disabled = true;
  try {
    const r = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text})});
    if (!r.ok) throw new Error(await r.text());
    render(await r.json()); $("status").textContent = "";
  } catch (e) { $("status").textContent = "Ошибка: " + e.message; }
  $("go").disabled = false;
};
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  $("status").textContent = "Агент работает…";
  const r = await fetch("/api/upload", {method:"POST", body: fd});
  if (r.ok) { render(await r.json()); $("status").textContent = ""; } else $("status").textContent = "Ошибка: " + await r.text();
};
$("report").onclick = () => window.open(`/api/runs/${current.run_id}/report`, "_blank");
</script>
</body>
</html>

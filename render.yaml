# Render Blueprint: New > Blueprint > выбрать репозиторий. Ключ задать в Dashboard (sync: false).
# Бесплатный план засыпает через ~15 мин простоя: на 24–28.09 (проверка) держать платный план
# или внешний пинг /health, иначе «проект недоступен» (п. 8.9).
services:
  - type: web
    name: hackalem-project
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_MODEL_STRONG
        value: gpt-5.5
      - key: FALLBACK_TO_MOCK
        value: "1"
